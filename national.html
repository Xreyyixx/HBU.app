<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HariVision | Haribo Broadcasting Union - Национальное голосование</title>

    <!-- PWA, Favicon & iOS Home Screen Support -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="icon" type="image/png" href="/icons/HBU_icon.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <meta name="theme-color" content="#060204">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HariVision">
    <meta name="application-name" content="HariVision">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="apple-touch-icon-precomposed" href="/icons/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #060204;
            color: #f8fafc;
            overflow-x: hidden;
        }
        .page-fade { animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .heart-poly { filter: drop-shadow(0 2px 6px rgba(245, 158, 11, 0.4)); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
        ::-webkit-scrollbar-thumb { background: rgba(245, 158, 11, 0.25); border-radius: 9999px; }
    </style>
</head>
<body class="relative min-h-screen flex flex-col items-center justify-between p-4 md:p-8 select-none">
    <canvas id="bg-canvas" class="fixed inset-0 w-full h-full pointer-events-none z-0"></canvas>

    <header class="relative z-10 w-full max-w-3xl mx-auto flex items-center justify-between pt-2 pb-4 mb-2">
        <a href="index.html" class="flex items-center gap-3">
            <div class="w-2.5 h-2.5 bg-amber-500 rounded-full animate-pulse shadow-[0_0_10px_#f59e0b]"></div>
            <span class="text-xs font-black tracking-[0.25em] text-amber-200/90 uppercase">HariVision <span class="text-amber-500">2026</span></span>
        </a>
        <div class="flex items-center gap-3">
            <a href="index.html" class="text-[10px] font-bold tracking-wider text-amber-400/80 hover:text-amber-300 uppercase">
                &larr; На сайт
            </a>
            <div class="text-[10px] font-bold tracking-[0.2em] text-amber-500/60 uppercase bg-amber-500/5 px-3 py-1.5 rounded-full border border-amber-500/10">
                National Voting
            </div>
        </div>
    </header>

    <main class="relative z-10 w-full max-w-3xl mx-auto flex flex-col justify-between flex-grow my-auto">
        <section id="app-card" class="w-full my-auto bg-[#0d0408]/85 backdrop-blur-2xl p-6 md:p-10 border border-amber-500/20 shadow-[0_30px_90px_rgba(0,0,0,0.95)] min-h-[580px] flex flex-col justify-between transition-all duration-700 rounded-3xl page-fade">
            <div class="flex items-center justify-center my-auto">
                <div class="w-8 h-8 border-2 border-amber-500/30 border-t-amber-500 rounded-full animate-spin"></div>
            </div>
        </section>
    </main>

    <!-- User & Artist Auth Modal (Вход / Регистрация) -->
    <div id="auth-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-3 sm:p-5">
        <div class="bg-[#0d0408] border border-amber-500/30 w-full max-w-md p-6 sm:p-8 flex flex-col gap-5 rounded-3xl shadow-[0_20px_70px_rgba(0,0,0,0.9)] page-fade">
            <!-- Modal Header -->
            <div class="flex items-center justify-between border-b border-amber-500/20 pb-3">
                <div class="flex items-center gap-2">
                    <div class="w-7 h-7 bg-amber-500/10 border border-amber-500/30 flex items-center justify-center rounded-xl">
                        <span class="text-amber-400 text-sm">👤</span>
                    </div>
                    <span class="text-xs font-black tracking-widest text-white uppercase" id="auth-modal-title">Авторизация</span>
                </div>
                <button onclick="closeAuthModal()" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-white bg-[#16070b] border border-amber-500/20 rounded-xl transition font-bold text-sm">✕</button>
            </div>

            <!-- Subtitle Prompt -->
            <div id="auth-modal-prompt" class="text-xs text-amber-200/80 font-medium">
                Войдите под своим логином или зарегистрируйтесь для участия в голосовании.
            </div>

            <!-- Tabs: Вход / Регистрация -->
            <div class="flex bg-[#16070b] p-1 rounded-2xl border border-amber-500/20">
                <button id="auth-tab-login" onclick="switchAuthTab('login')" class="flex-1 py-2 rounded-xl text-xs font-bold uppercase tracking-wider bg-amber-500 text-slate-950 shadow-md transition">
                    Вход
                </button>
                <button id="auth-tab-register" onclick="switchAuthTab('register')" class="flex-1 py-2 rounded-xl text-xs font-bold uppercase tracking-wider text-slate-400 hover:text-white transition">
                    Регистрация
                </button>
            </div>

            <!-- Error container -->
            <div id="auth-form-error" class="hidden text-xs text-rose-400 bg-rose-950/40 p-3 rounded-xl border border-rose-500/30 font-medium"></div>

            <!-- Tab 1: Form Login -->
            <form id="auth-login-form" onsubmit="handleAuthLoginSubmit(event)" class="flex flex-col gap-3.5">
                <div>
                    <label class="block text-[10px] font-bold text-amber-400 uppercase tracking-widest mb-1.5">Логин или Email</label>
                    <input type="text" id="auth-login-identifier" required placeholder="Введите ваш логин или почту..." class="w-full bg-[#16070b] border border-amber-500/20 px-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 rounded-xl" />
                    <span class="text-[10px] text-slate-500 mt-1 block">Артисты могут вводить логин без @ (например, austria или p1)</span>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-amber-400 uppercase tracking-widest mb-1.5">Пароль</label>
                    <input type="password" id="auth-login-password" required placeholder="••••••••" class="w-full bg-[#16070b] border border-amber-500/20 px-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 rounded-xl" />
                </div>

                <button type="submit" id="auth-login-submit-btn" class="w-full mt-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black text-xs uppercase tracking-widest py-3.5 transition shadow-lg rounded-xl">
                    Войти
                </button>
            </form>

            <!-- Tab 2: Form Register -->
            <form id="auth-register-form" onsubmit="handleAuthRegisterSubmit(event)" class="hidden flex flex-col gap-3.5">
                <div>
                    <label class="block text-[10px] font-bold text-amber-400 uppercase tracking-widest mb-1.5">Ваше имя / Никнейм</label>
                    <input type="text" id="auth-register-name" placeholder="Как вас называть..." class="w-full bg-[#16070b] border border-amber-500/20 px-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 rounded-xl" />
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-amber-400 uppercase tracking-widest mb-1.5">Email или логин</label>
                    <input type="text" id="auth-register-identifier" required placeholder="user@example.com или nickname..." class="w-full bg-[#16070b] border border-amber-500/20 px-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 rounded-xl" />
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-amber-400 uppercase tracking-widest mb-1.5">Пароль (минимум 6 символов)</label>
                    <input type="password" id="auth-register-password" required minlength="6" placeholder="••••••••" class="w-full bg-[#16070b] border border-amber-500/20 px-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 rounded-xl" />
                </div>

                <button type="submit" id="auth-register-submit-btn" class="w-full mt-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black text-xs uppercase tracking-widest py-3.5 transition shadow-lg rounded-xl">
                    Зарегистрироваться
                </button>
            </form>
        </div>
    </div>

    <script type="module" src="/app.js"></script>
</body>
</html>
